<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANT Youth Foundation | Empowering Next-Gen STEM Leaders</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --text-main: #334155;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --white: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--white);
        }

        /* 顶部导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.2em;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* 头部 Hero 区域 */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }

        header h1 {
            margin: 15px 0;
            font-size: 3em;
            letter-spacing: -1px;
            font-weight: 800;
        }

        header p {
            margin: 0 auto;
            font-size: 1.25em;
            color: #94a3b8;
            max-width: 650px;
        }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        /* 容器布局 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        section {
            margin-bottom: 80px;
        }
